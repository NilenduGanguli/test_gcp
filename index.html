<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZiffyHealth - Cloud Run Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 48px;
      max-width: 520px;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; color: #38bdf8; }
    .subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 32px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 8px 20px;
      border-radius: 24px;
      font-size: 14px;
      color: #4ade80;
      margin-bottom: 24px;
    }
    .dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .meta { font-size: 12px; color: #64748b; line-height: 1.8; }
    .meta span { color: #94a3b8; font-family: monospace; background: rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">&#x1F3E5;</div>
    <h1>ZiffyHealth</h1>
    <p class="subtitle">IoT-Enabled Healthcare Platform</p>
    <div class="status"><div class="dot"></div> Running on Cloud Run</div>
    <div class="meta">
      Region: <span>asia-south1</span><br>
      Runtime: <span>nginx/alpine</span><br>
      Port: <span>8080</span>
    </div>
  </div>
</body>
</html>
